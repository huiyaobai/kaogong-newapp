<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e2b38">
<title>考公新App</title>
<style>
/* 2026-11-11 全新 UI: 「墨与朱」— 原创设计, 不抄上岸鸭.
   变量名沿用旧名 (避免改 JS 内联样式里的 var(--jade) 等引用):
   --jade 现在是朱红主色, --jaded 是深朱红, --mint 是暖沙底色. */
:root{--ink:#1e2b38;--ink2:#33465c;--jade:#e0452f;--jaded:#b73220;--mint:#f6e8dc;--bg:#faf5ec;--card:#fff;--line:#e8dfcb;--sub:#7c7263;--red:#c0392b;--gold:#a97e10;--ok:#2e7d5b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
body.lock{overflow:hidden}
.phone{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.apphead{position:sticky;top:0;z-index:8;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:rgba(250,245,236,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.apphead .brand{font-weight:900;font-size:17px}
.apphead .brand::before{content:"";display:inline-block;width:12px;height:12px;background:var(--jade);border-radius:3px;margin-right:7px;vertical-align:-1px}
.hbtns{display:flex;gap:8px}
.hbtn{position:relative;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--ink);cursor:pointer}
.hbtn .dot{position:absolute;top:-5px;right:-3px;background:var(--red);color:#fff;border-radius:999px;font-size:10px;padding:1px 5px;font-weight:800}
main{flex:1;padding-bottom:86px}
.view{display:none}.view.on{display:block}
.hero{background:linear-gradient(160deg,var(--ink),var(--ink2) 55%,var(--jaded));color:#fff;border-radius:0 0 24px 24px;padding:18px 20px 22px}
.hero h1{margin:10px 0 8px;font-size:26px;line-height:1.4;font-weight:900}
.hero h1 .hl{color:#f5c04a}
.hero p{margin:0;color:#d9cfbe;font-size:13.5px;line-height:1.6}
.hero .date{display:inline-block;background:rgba(255,255,255,.14);border-radius:999px;padding:6px 12px;font-size:12.5px;margin-top:12px}
.hbadge{display:inline-block;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:5px 11px;font-size:12px;color:#e5dcc8}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 14px;box-shadow:0 4px 14px rgba(60,40,20,.06)}
.card.note p{margin:6px 0 0}
.sect{display:flex;justify-content:space-between;align-items:baseline;margin:18px 16px 4px}
.sect h2{font-size:17px;margin:0;font-weight:900}
.sect h2::before{content:"";display:inline-block;width:5px;height:16px;border-radius:3px;background:var(--jade);margin-right:8px;vertical-align:-2px}
.sect .rt{color:var(--sub);font-size:12.5px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px 6px;text-align:center;box-shadow:0 4px 12px rgba(60,40,20,.05)}
.kpi b{display:block;font-size:21px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--sub)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 14px}
.gcard{border:1px solid var(--line);border-radius:16px;padding:15px;cursor:pointer;min-height:86px;background:#fff;box-shadow:0 4px 12px rgba(60,40,20,.05)}
.gcard b{font-size:16px;display:block;margin-bottom:5px}
.gcard span{font-size:12.5px;color:var(--sub);line-height:1.5}
.gcard.jade{background:var(--mint)}
.gcard.teal2{background:#f7ecd4}
.gcard.deep{background:linear-gradient(150deg,var(--ink2),var(--jaded));color:#fff}
.gcard.deep span{color:#ecd9c8}
.btn{background:var(--jade);color:#fff;border:0;border-radius:999px;padding:11px 18px;font-size:14.5px;font-weight:800;width:100%;cursor:pointer;font-family:inherit;box-shadow:0 4px 12px rgba(224,69,47,.28)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:0 2px 8px rgba(60,40,20,.05)}
.btn.ink{background:var(--ink2)}
.btn.sm{padding:8px 14px;font-size:13px;width:auto}
.btn:disabled{opacity:.45;cursor:default}
.row2{display:flex;gap:8px}
.chip{display:inline-block;padding:6px 13px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;margin:3px 4px 3px 0;cursor:pointer;font-weight:700}
.chip.on{background:var(--jade);color:#fff;border-color:var(--jade)}
.mini{background:var(--mint);color:var(--jaded);border:0;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit}
.mini.grey{background:#f0ebdd;color:var(--sub)}
.task{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px;gap:8px}
.task:last-child{border:0}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 8px}
.bar i{display:block;height:100%;background:var(--jade);border-radius:99px}
.mbar{margin-bottom:8px}
.mbar .lbl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub)}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:11px 13px;margin:8px 0;font-size:15px;cursor:pointer;line-height:1.6;font-family:inherit;color:var(--ink)}
.opt .k{font-weight:900;color:var(--jaded);margin-right:8px}
.opt.right{border-color:var(--ok);background:#e7f3ea}
.opt.right .k{color:var(--ok)}
.opt.wrong{border-color:var(--red);background:#fdecea}
.opt.sel{border-color:var(--jade);background:var(--mint)}
.opt.dis{cursor:default;opacity:.9}
.qstem{font-size:16px;line-height:1.8;margin:8px 0}
.qstem img,.opt img,.qmat img,.slpre img,.ans img{max-width:100%;height:auto;border-radius:8px;margin:4px 0}
.qmeta{font-size:12px;color:var(--sub);display:flex;justify-content:space-between;align-items:center;gap:8px}
.starbtn{background:none;border:0;font-size:18px;cursor:pointer;padding:2px 6px;color:var(--gold);font-family:inherit}
.qmat{background:#f5efe2;border-radius:14px;padding:10px 13px;margin:8px 0;font-size:14px;line-height:1.8}
.qmat summary{cursor:pointer;font-weight:800;color:var(--ink2);font-size:13.5px}
.qmat>div{margin-top:8px}
.ans{background:#f7f0df;border-radius:14px;padding:12px 13px;margin-top:10px;font-size:14px;line-height:1.75;white-space:pre-wrap}
.ans b{color:var(--jaded)}
.meta{font-size:12px;color:var(--sub)}
.small{font-size:12.5px;color:var(--sub);text-align:center;line-height:1.6}
.big{font-size:46px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0}
.tag{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:800;margin:2px 4px 2px 0;vertical-align:1px;white-space:nowrap}
.tag.hot{background:#fdecea;color:var(--red)}
.tag.warm{background:#faf3e0;color:var(--gold)}
.tag.cold{background:#e6f2e8;color:var(--ok)}
.tag.grey{background:#f0ebdd;color:var(--sub)}
.tag.new{background:var(--red);color:#fff}
.tag.jade{background:var(--mint);color:var(--jaded)}
.pill{display:inline-block;background:var(--mint);color:var(--jaded);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:800;margin-left:7px;vertical-align:2px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -4px 20px rgba(60,40,20,.10);display:flex;z-index:9;padding:7px 4px calc(7px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;font-size:11px;color:#9a8f7c;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0 2px;font-family:inherit}
nav button .ic{font-size:20px;line-height:1.1}
nav button.on{color:var(--jaded);font-weight:800}
nav button.on::after{content:"";width:16px;height:3px;border-radius:99px;background:var(--jade);margin-top:1px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(8px);background:var(--ink);color:#fff;border-radius:999px;padding:9px 16px;font-size:13.5px;font-weight:700;opacity:0;pointer-events:none;transition:all .25s;z-index:80;max-width:86%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#ovl{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;flex-direction:column}
#ovl.on{display:flex}
.ovlhead{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;background:rgba(250,245,236,.97);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);z-index:5;font-weight:900;font-size:15.5px;min-height:52px}
.ovlhead .t{flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.backbtn{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:800;cursor:pointer;color:var(--ink);font-family:inherit;min-width:52px}
.ovlbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:40px}
.ovlbody .card{margin-top:12px}
#cmodal{position:fixed;inset:0;background:rgba(30,20,10,.45);z-index:70;display:none;align-items:center;justify-content:center;padding:24px}
#cmodal.on{display:flex}
.cmbox{background:#fff;border-radius:18px;padding:20px;max-width:320px;width:100%}
.cmbox .cmmsg{font-size:14.5px;line-height:1.7;font-weight:600;margin-bottom:16px;white-space:pre-line}
.cmbox .cmrow{display:flex;gap:8px}
input[type=text],input[type=number],input[type=search],select{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:13px;font-size:15px;font-family:inherit;background:#fff;margin:5px 0;color:var(--ink)}
label.fl{display:block;font-size:13px;font-weight:800;margin:10px 0 2px;color:var(--ink2)}
.prow{border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin:9px 0;background:#fff;cursor:pointer}
.prowT{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.prowT b{font-size:15px;line-height:1.5}
.prowS{font-size:12.5px;color:var(--sub);margin:3px 0}
.prowM{font-size:12.5px;color:var(--sub);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{margin:6px 0 2px}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:10px;font-size:13px;color:var(--sub)}
.pager .btn{width:auto}
.kv{display:grid;grid-template-columns:88px 1fr;gap:6px 10px;font-size:13.5px;line-height:1.65}
.kv .k{color:var(--sub)}
.tl{list-style:none;margin:10px 0 0;padding:0}
.tl li{position:relative;padding:0 0 14px 20px;font-size:13.5px;line-height:1.6}
.tl li::before{content:"";position:absolute;left:5px;top:6px;width:8px;height:8px;border-radius:99px;background:var(--jade)}
.tl li::after{content:"";position:absolute;left:8.5px;top:16px;bottom:0;width:1.5px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl li b{color:var(--jaded)}
.pal{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:10px}
.palbtn{aspect-ratio:1;border:1.5px solid var(--line);border-radius:9px;background:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--sub);padding:0}
.palbtn.done{background:var(--mint);border-color:var(--jade);color:var(--jaded)}
.palbtn.mark{border-color:var(--gold);color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.palbtn.cur{outline:2px solid var(--ink2);outline-offset:1px}
.bscale{position:relative;height:26px;background:#f0ebdd;border-radius:8px;margin:6px 0 2px}
.bscale .band{position:absolute;top:6px;height:14px;background:var(--mint);border:1.5px solid var(--jade);border-radius:8px}
.bscale .sc{position:absolute;top:-2px;width:3px;height:30px;background:var(--gold);border-radius:2px}
.bsrow{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:8px;border-bottom:1px dashed var(--line);padding:5px 0}
.bsrow:last-child{border:0}
.mono{font-variant-numeric:tabular-nums}
.imgmiss{display:inline-block;background:#f4eee1;border:1px dashed var(--line);color:var(--sub);padding:8px 12px;border-radius:8px;font-size:12px}
.slpre{white-space:pre-wrap;font-size:14.5px;line-height:1.9;margin:8px 0}
.slmat{background:#f6f0e3;border-radius:14px;padding:10px 13px;margin:10px 0}
.slmat summary{cursor:pointer;font-weight:800;color:var(--ink2)}
.slq{border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin:10px 0;background:#fff}
.subrow{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14.5px;gap:8px}
.subrow:last-child{border:0}
.dash{font-size:12.5px;color:var(--sub)}
.synw{border-left:3px solid var(--jade);padding-left:10px;margin:10px 0}
.synw b{font-size:15px}
.gtab{display:flex;gap:8px;margin:4px 0 10px}
.resume{background:#fdf6e8;border:1px solid #ecd9ac;border-radius:14px;padding:12px 14px;margin:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px;font-weight:700}
.cmptable{border-collapse:collapse;width:100%;font-size:13px;min-width:340px}
.cmptable th,.cmptable td{border:1px solid var(--line);padding:8px 9px;text-align:left;vertical-align:top;line-height:1.55}
.cmptable th{background:var(--mint);font-size:13px}
.cmptable th a{color:var(--ink);text-decoration:none;font-weight:900}
.cmptable tr.diff td{background:#fdf0ec}
.cmptable tr.diff td:first-child{background:#fdecea}
</style>
</head>

<script>
'use strict';
/* ============================================================
   考公新App · 单页应用（clean-room 重建，见 BUILD-SPEC.md）
   命名空间：localStorage sy_* 与 v1.6.2 (gz_*) 完全隔离
   ============================================================ */
/* ---- 0. 常量（名字占位，正式名待用户定，见 BUILD-SPEC §10） ---- */
var APP_NAME='考公新App';
var APP_VER='1.0.0';
var OTA_BASE='https://kaogong-admin-343207-8-1256273077.sh.run.tcloudbase.com';
var APP_KEY='kg_bf39a383102b1524fb5fea3d09ae3907'; /* 与 v1.6.2 共用后台接口 Key（X-App-Key），泄露后以后端 env APP_API_KEY 轮换 */
var OTA_IMG_DEFAULT='https://kaogong-d2guugk0k71537d29-1256273077.tcloudbaseapp.com/assets/img/';
var PROV_SEED=['北京','天津','河北','山西','内蒙古','辽宁','吉林','黑龙江','上海','江苏','浙江','安徽','福建','江西','山东','河南','湖北','湖南','广东','广西','海南','重庆','四川','贵州','云南','西藏','陕西','甘肃','青海','宁夏','新疆'];
var SUB_REGIONS=['国考','江苏','浙江','天津','广东','上海','山东','重庆'];

/* ---- 1. 本机存储 ---- */
var LSK={app:'sy_app',profile:'sy_profile',favpos:'sy_fav_pos',subs:'sy_subs',meta:'sy_ota_meta',compare:'sy_compare'};
function lsGet(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var ST=lsGet(LSK.app,{});
ST.attempts=ST.attempts||{};ST.wrong=ST.wrong||{};ST.fav=ST.fav||[];
ST.mocks=ST.mocks||[];ST.hist=ST.hist||[];ST.cut=ST.cut||{};ST.provCache=ST.provCache||[];
ST.checkin=ST.checkin||{last:null,streak:0,total:0,dates:[]};
ST.today=ST.today||{date:'',practiced:0,wrongRedo:0,mock:0,notice:false};
var PROFILE=lsGet(LSK.profile,{major:'',edu:'',politics:'',base:'',province:'',kw:''});
var FAVPOS=lsGet(LSK.favpos,[]);
var SUBS=lsGet(LSK.subs,['国考']);
var OTAMETA=lsGet(LSK.meta,null);
function saveST(){lsSet(LSK.app,ST)}
function saveProfile(){lsSet(LSK.profile,PROFILE)}
function saveFavPos(){lsSet(LSK.favpos,FAVPOS)}
var COMPARE=lsGet(LSK.compare,[]);
function saveCompare(){lsSet(LSK.compare,COMPARE)}
function saveSubs(){lsSet(LSK.subs,SUBS)}

/* ---- 2. 工具 ---- */
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad2(n){return(n<10?'0':'')+n}
function todayStr(d){d=d||new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function todayCn(){var d=new Date();var w='日一二三四五六'[d.getDay()];return (d.getMonth()+1)+'月'+d.getDate()+'日 周'+w}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function sampleN(arr,n){return shuffle(arr).slice(0,n)}
function fmtMS(ms){ms=Math.max(0,ms);var s=Math.floor(ms/1000);return pad2(Math.floor(s/60))+':'+pad2(s%60)}
function fmtDur(secs){if(secs>=3600)return Math.floor(secs/3600)+'时'+Math.floor(secs%3600/60)+'分';if(secs>=60)return Math.floor(secs/60)+'分'+(secs%60)+'秒';return secs+'秒'}
function fmtDT(ts){var d=new Date(ts);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+' '+pad2(d.getHours())+':'+pad2(d.getMinutes())}
function trunc(s,n){s=String(s||'');return s.length>n?s.slice(0,n)+'…':s}
var TOASTT=null;
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(TOASTT);TOASTT=setTimeout(function(){t.classList.remove('on')},2200)}
var CMOK=null;

function cmResolve(y){$('#cmodal').classList.remove('on');if(y&&CMOK){var f=CMOK;CMOK=null;f()}else{CMOK=null}}
function ensureToday(){var t=todayStr();if(ST.today.date!==t){ST.today={date:t,practiced:0,wrongRedo:0,mock:0,notice:false};saveST()}}

/* ---- 3. 数据访问 ---- */
function QBY(){return window.QB_QUESTIONS||[]}
function qById(id){if(!window.__QI){var m={};QBY().forEach(function(q){m[q.id]=q});window.__QI=m}return window.__QI[id]}
function MATS(){return window.QB_MATERIALS||{}}
function PAPERS(){return window.QB_PAPERS||[]}
function TREE(){return window.QB_TREE||[]}
function QUOTA(){return window.QB_MOCK_QUOTA||{}}
function SHENLUN(){return window.QB_SHENLUN||[]}
function KAODIAN(){return window.QB_KAODIAN||{modules:[]}}
function VOCAB(){return window.QB_VOCAB||{idioms:[],synonym_groups:[]}}
function ZHAOKAO(){return window.QB_ZHAOKAO||{notices:[]}}
function paperName(p){return (p.exam||'')+' '+(p.year||'')+' '+(p.level||'')+' 行测'}
function stats(){var n=0,c=0,u=0,a=ST.attempts;for(var k in a){u++;n+=a[k].n;c+=a[k].c}return{uniq:u,n:n,c:c,acc:n?Math.round(c/n*100):0}}
function moduleAttempted(){var o={};var a=ST.attempts;for(var id in a){var q=qById(id);if(q){o[q.module]=o[q.module]||0;o[q.module]++}}return o}
function wrongCount(){var n=0;for(var k in ST.wrong)n++;return n}
function noticeSorted(){var ns=(ZHAOKAO().notices||[]).slice();ns.sort(function(a,b){return (b.publish_date||'').localeCompare(a.publish_date||'')});return ns}
function subMatch(n){if(SUBS.indexOf('国考')>=0&&(n.exam_type==='国考'||n.region==='全国'))return true;
 return SUBS.some(function(s){if(s==='国考')return false;return (n.region||'').indexOf(s)>=0})}
function isFresh(n){var t=new Date(n.publish_date||'').getTime();if(!t||isNaN(t))return false;return (Date.now()-t)<=7*86400000&&subMatch(n)}

/* ---- 4. 图片兜底：assets/img 失败 → OTA images_base 重试一次 → ⚠️ 原图缺失 ---- */
window.addEventListener('error',function(e){var t=e.target;
 if(t&&t.tagName==='IMG'){var st=t.getAttribute('data-fb')||'1';var src=t.getAttribute('src')||'';var name=src.split('/').pop();
  if(st==='1'&&name){t.setAttribute('data-fb','2');t.src=(OTA.imagesBase||OTA_IMG_DEFAULT)+name}
  else{var s=document.createElement('span');s.className='imgmiss';s.textContent='⚠️ 原图缺失';t.replaceWith(s)}}},true);

/* ---- 5. 路由（5 个底部 Tab） ---- */
var CUR='home';
var TABVIEWS={home:function(){vHome()},choose:function(){vChoose()},bank:function(){vBank()},mock:function(){vMock()},mine:function(){vMine()}};
function go(name){CUR=name;document.querySelectorAll('.view').forEach(function(s){s.classList.remove('on')});
 var sec=document.getElementById('v-'+name);if(sec)sec.classList.add('on');
 document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-v')===name)});
 if(TABVIEWS[name])TABVIEWS[name]();window.scrollTo(0,0)}
function refreshCurrent(){if(OVLS.length)rerenderOvl();else if(TABVIEWS[CUR])TABVIEWS[CUR]()}

/* ---- 6. 全屏覆盖层（带返回栈） ---- */
var OVLS=[];
var ovlEl=null,ovlBodyEl=null;
function ovlInit(){ovlEl=$('#ovl');ovlBodyEl=$('#ovlBody')}
function ovlTop(){return OVLS[OVLS.length-1]||null}
function setHead(t){$('#ovlTitle').textContent=t||''}
function ovlRender(){var t=ovlTop();if(!t)return;t.render();ovlEl.classList.add('on');document.body.classList.add('lock');ovlEl.scrollTop=0;ovlBodyEl.scrollTop=0}
function pushOvl(render,back){OVLS.push({render:render,back:back||null});ovlRender()}
function popOvl(){OVLS.pop();if(OVLS.length)ovlRender();else ovlClose()}
function ovlBack(){var t=ovlTop();if(t&&t.back)t.back();else popOvl()}
function ovlClose(){OVLS=[];ovlEl.classList.remove('on');document.body.classList.remove('lock')}
function rerenderOvl(keepScroll){var t=ovlTop();if(!t)return;var st=ovlBodyEl.scrollTop;t.render();ovlBodyEl.scrollTop=keepScroll?st:0}
function rerenderView(){if(TABVIEWS[CUR])TABVIEWS[CUR]()}

/* ---- 7. 收藏（题目） ---- */
function isFavQ(id){return ST.fav.indexOf(id)>=0}
function favQToggle(id){var i=ST.fav.indexOf(id);
 if(i>=0){ST.fav.splice(i,1);toast('已取消收藏')}else{ST.fav.push(id);toast('已收藏')}
 saveST();refreshCurrent()}

'use strict';

  +(isFresh(n)?'<span class="tag new">新</span>':'')
  +'<br><span class="dash">'+esc(n.region||'')+' · '+esc(n.publish_date||'')+' · '+esc(n.status||'')+'</span></span><span>›</span></div>'}).join('')}
function todayTasksHtml(){ensureToday();var t=ST.today;
 var items=[
  {ok:t.practiced>=10,txt:'练 10 题（'+Math.min(t.practiced,10)+'/10）',act:"go('bank')"},
  {ok:t.wrongRedo>=5,txt:'错题重做 5 题（'+Math.min(t.wrongRedo,5)+'/5）',act:"bankOpen('wrong')"},

 return Object.keys(seen).map(function(m){var tot=seen[m],dn=done[m]||0,pct=tot?Math.round(dn/tot*100):0;
  return '<div class="mbar"><div class="lbl"><span>'+esc(m)+'</span><span class="mono">'+dn+' / '+tot+' 题</span></div><div class="bar"><i style="width:'+pct+'%"></i></div></div>'}).join('')}
function checkIn(){ensureToday();var t=todayStr();
 if(ST.checkin.last===t){toast('今天已打过卡啦');return}
 var y=todayStr(new Date(Date.now()-86400000));
 ST.checkin.streak=(ST.checkin.last===y)?ST.checkin.streak+1:1;
 ST.checkin.last=t;ST.checkin.total++;
 ST.checkin.dates=(ST.checkin.dates||[]).concat([t]).slice(-120);

function otaHomeLine(){var v=OTAMETA&&OTAMETA.version?('数据版本 v'+OTAMETA.version):'数据版本：内置基线';
 var s=OTAMETA&&OTAMETA.lastSync?(' · 同步于 '+fmtDT(OTAMETA.lastSync)):' · 未同步';
 return '<p class="small" style="margin:14px 16px 6px;cursor:pointer" onclick="go(\'mine\')">'+esc(v+s)+' · 学习数据只存在本机 ›</p>'}
function vHome(){var el=document.getElementById('v-home');var st=stats();var days=gkCountdown();var cd=ST.checkin.last===todayStr();
 el.innerHTML=
 '<div class="hero"><span class="hbadge">行测真题 '+QBY().length.toLocaleString()+' 题 · 19 套卷 · 国考+省考职位检索</span>'

 +'<div class="kpi"><b>'+st.acc+'%</b><span>正确率</span></div></div>'
 +'<div class="card"><b>✅ 今日任务</b><span class="meta" style="margin-left:6px">'+todayCn()+'</span><div style="margin-top:6px">'+todayTasksHtml()+'</div></div>'
 +'<div class="card"><b>📢 招考公告</b><div style="margin-top:4px">'+homeNoticesHtml()+'</div>'

 +'<label class="fl">学历</label><select id="posEdu"><option value="">不限</option>'+['大专','本科','硕士研究生','博士研究生'].map(function(o){return '<option'+(PROFILE.edu===o?' selected':'')+'>'+o+'</option>'}).join('')+'</select>'
 +'<label class="fl">政治面貌</label><select id="posPol"><option value="">不限</option>'+['中共党员','中共党员或共青团员','共青团员','群众','不限'].map(function(o){return '<option'+(PROFILE.politics===o?' selected':'')+'>'+o+'</option>'}).join('')+'</select>'
 +'<label class="fl">基层工作最低年限</label><select id="posBase"><option value="">不限</option>'+['一年','二年','三年','四年','五年及以上'].map(function(o){return '<option'+(PROFILE.base===o?' selected':'')+'>'+o+'</option>'}).join('')+'</select>'
 +'<label class="fl">意向省份</label><input type="text" id="posProv" list="provList" value="'+esc(PROFILE.province)+'" placeholder="如：江苏（可留空）"><datalist id="provList">'+provDatalist()+'</datalist>'
 +'<label class="fl">关键词（部门 / 职位名）</label><input type="text" id="posKw" value="'+esc(PROFILE.kw)+'" placeholder="如：铁路公安">'
 +'<div class="row2" style="margin-top:12px"><button class="btn" style="flex:1" onclick="posSaveProfile(false)">保存画像</button><button class="btn ghost" style="flex:1" onclick="posClearProfile()">清空</button></div>'
 +'<p class="meta" style="margin-top:8px">画像只保存在这台设备上，不上传、不同步。</p></div>'
 +'<div class="card"><b>职位检索</b><span class="meta" style="margin-left:6px">官方职位表 · 约 4 万条</span>'
 +'<div style="margin-top:10px"><button class="btn ink" onclick="posSearch(1)">按画像检索 →</button></div>'
 +'<p class="meta" id="posMeta" style="margin-top:8px">检索需要联网；无网时题库刷题不受影响。</p>'
 +'<div id="posList"></div><div id="posPager" class="pager"></div></div>'
 +'<div class="card"><b>⭐ 收藏的职位</b><span class="meta" id="fpCount" style="margin-left:6px"></span><div id="fpList" style="margin-top:4px"></div></div>'
 +'<div class="card note"><p class="meta">· 详情页不展示薪资：暂无官方数据来源，不编造。<br>· 实时报名人数官方不逐岗公布，只提供基于历年进面分的静态热度估算。<br>· 进面分来自国家公务员局历年面试名单，仅供参考。<br>· 新功能：职位解读卡、自动标签、对比篮（最多 4 个）、分享文本卡——都在职位详情里。</p></div>';
 renderFavPos();renderCompareBtn();if(POS.res)renderPosResult()}

 if(major)q.major=major;if(edu)q.edu=edu;if(pol)q.politics=pol;if(base)q.base=base;if(prov)q.province=prov;if(kw)q.q=kw;

 $('#posMeta').textContent='检索中…';$('#posList').innerHTML='';

 .catch(function(e){$('#posMeta').textContent='检索失败：'+(e&&e.message?e.message:'网络不可用')+'。可稍后重试；题库刷题不受影响。'})}
function bandChip(hist){if(!hist||hist.min==null)return '<span class="tag grey">近3年进面分：暂缺</span>';
 return '<span class="tag jade">近3年进面 '+hist.min.toFixed(1)+'–'+hist.max.toFixed(1)+'</span>'}
var TAGRULES=[
 {name:'加班多',re:/加班|值班|节假日|任务重|强度大/,desc:'备注提到加班、值班或工作强度大'},
 {name:'常出差',re:/出差|外勤|驻外/,desc:'备注提到出差、外勤或驻外'},
 {name:'体能测试',re:/体能测评|体能测试|体能/,desc:'需按人民警察要求做体能测评'},

 {name:'服务年限',re:/服务年限|最低服务/,desc:'备注提到最低服务年限'},

function extractTags(d){var txt=((d.intro||'')+'\n'+(d.note||''));

 if(d.prof_test==='是')out.push({name:'专业考试',re:null,desc:'需参加专业科目考试'});
 if(d.base_years>0)out.push({name:'基层年限'+d.base_years+'年',re:null,desc:'要求基层工作最低年限'+d.base_years+'年'});

function tagNames(){return TAGRULES.map(function(r){return r.name})}
function countRestrict(d){var rest=0;
 if(d.politics_raw&&d.politics_raw.indexOf('不限')<0)rest++;
 if(d.base_years>0)rest++;
 if(d.prof_test==='是')rest++;
 if(d.major_raw&&d.major_raw.indexOf('不限')<0)rest++;
 return rest}
function heatInfo(d,hist){if(!hist||hist.min==null)return null;
 var score=(hist.latest&&hist.latest.min_score!=null)?hist.latest.min_score:hist.min;
 var passLine=(hist.max>100)?105:60;
 var diff=score-passLine;
 var cnt=d.count||0,rest=countRestrict(d);
 var tier;
 if(diff>20||cnt===1)tier='热';
 else if(diff<5&&rest>=3)tier='冷';
 else tier='温';
 return {tier:tier,diff:diff,rest:rest,score:score,
  reason:'近3年进面分 '+hist.min.toFixed(1)+'–'+hist.max.toFixed(1)+'，招'+cnt+'人'+(rest?('，'+rest+'项限制'):'')}}
function heatChip(d,hist){var h=heatInfo(d,hist);if(!h)return '';
 var cls=h.tier==='热'?'hot':(h.tier==='冷'?'cold':'warm');
 return '<span class="tag '+cls+'" title="'+esc(h.reason)+'">热度：'+h.tier+'</span>'}

  if(r.diag&&Object.keys(r.diag).length){var names={edu:'学历',politics:'政治面貌',base:'基层年限',province:'省份',major:'专业'};
   msg+='<p class="meta">逐项放宽后的命中数：<br>'+Object.keys(r.diag).map(function(k){return '· 放宽'+(names[k]||k)+' → 约 '+r.diag[k].toLocaleString()+' 条'}).join('<br>')+'</p>'}
  $('#posList').innerHTML=msg;$('#posPager').innerHTML='';return}
 var tagRow='<div class="chips" style="margin:8px 0 2px"><span class="meta" style="margin-right:4px">按标签筛本页：</span>'
  +'<span class="chip'+(POS.tagFilter?'':' on')+'" onclick="POS.tagFilter=null;renderPosResult()">全部</span>'
  +tagNames().map(function(t){return '<span class="chip'+(POS.tagFilter===t?' on':'')+'" onclick="POS.tagFilter=\''+t+'\';filterPosByTag(\''+t+'\')">'+t+'</span>'}).join('')+'</div>';
 $('#posList').innerHTML=tagRow+(r.results||[]).map(function(d){
  return '<div class="prow" onclick="posDetailOpen(\''+esc(d.id)+'\')">'
  +'<div class="prowT"><b>'+esc(d.title)+'</b><span style="display:flex;gap:4px;align-items:center">'
  +(FAVPOS.some(function(f){return f.id===d.id})?'<span style="color:var(--gold)">★</span>':'')
  +'<button class="mini" onclick="event.stopPropagation();compareToggleById(\''+esc(d.id)+'\')">+对比</button></span></div>'
  +'<div class="prowS">'+esc(d.dept)+' · '+esc(d.work_place||d.province||'')+'</div>'
  +'<div class="chips"><span class="tag grey">招 '+d.count+' 人</span>'

function weakModules(){var per={};QBY().forEach(function(q){per[q.module]=per[q.module]||{n:0,c:0}});
 var a=ST.attempts;for(var id in a){var q=qById(id);if(q&&per[q.module]){per[q.module].n+=a[id].n;per[q.module].c+=a[id].c}}
 return Object.keys(per).filter(function(m){var p=per[m];return p.n>=8&&p.c/p.n<0.7})
  .sort(function(x,y){return (per[x].c/per[x].n)-(per[y].c/per[y].n)}).slice(0,2)}
function smartBuild(total){var quota=QUOTA()['国考副省级（135 题）']||{};var mods=Object.keys(quota);
 if(!mods.length)return sampleN(QBY(),total).map(function(q){return q.id});
 var sum=0;mods.forEach(function(m){sum+=quota[m]});if(!sum)sum=135;
 var weak=weakModules();var w={},sw=0;
 mods.forEach(function(m){w[m]=(weak.indexOf(m)>=0?1.3:1)*quota[m];sw+=w[m]});
 var alloc=mods.map(function(m){var r=total*w[m]/sw;return{m:m,f:Math.floor(r)}}); /* 最大余数法 */
 var used=0;alloc.forEach(function(x){used+=x.f});
 alloc.sort(function(a,b){return (b.r%1)-(a.r%1)});
 var i=0;while(used<total&&alloc.length){alloc[i%alloc.length].f++;used++;i++}
 var chosen={},out=[];
 alloc.forEach(function(x){var pool=QBY().filter(function(q){return q.module===x.m&&!chosen[q.id]});
  var fresh=pool.filter(function(q){return !ST.attempts[q.id]||ST.wrong[q.id]});
  var pick=sampleN(fresh,x.f);if(pick.length<x.f){var rest=pool.filter(function(q){return fresh.indexOf(q)<0});pick=pick.concat(sampleN(rest,x.f-pick.length))}
  pick.forEach(function(q){chosen[q.id]=1;out.push(q.id)})});
 if(out.length<total){var rest=QBY().filter(function(q){return !chosen[q.id]});out=out.concat(sampleN(rest,total-out.length).map(function(q){return q.id}))}
 return out.slice(0,total)}

  if(MK.ans[id]===q.answer){ok++;per[q.module].c++}});

 var rec={at:Date.now(),key:MK.key,total:ids.length,ok:ok,pct:Math.round(ok/ids.length*1000)/10,per:per,secs:secs};

 +'<p class="small">'+(avg!=null?('近 3 次模考平均 '+avg+' 分。'):'')+'单次模考成绩不下结论；可与目标职位近 3 年进面分区间对比作参考（模考页「分数参考段」），仅供参考，不构成报考建议。</p></div>'

function bandUseMock(){if(!ST.mocks.length){toast('还没有模考记录');return}
 var el=document.getElementById('bandScore');if(el){el.value=ST.mocks[0].pct;toast('已填入最近模考分 '+ST.mocks[0].pct+' 分')}}
function bandCompare(){var out=document.getElementById('bandOut');if(!out)return;
 var score=parseFloat((document.getElementById('bandScore')||{}).value);
 if(isNaN(score)||score<0||score>100){out.innerHTML='<p class="meta">请输入 0–100 之间的折算分。</p>';return}
 var idx=parseInt((document.getElementById('bandPos')||{value:''}).value,10);
 if(isNaN(idx)||!FAVPOS[idx]){out.innerHTML='<p class="meta">请先在「选岗」页收藏目标职位，再选择对比。</p>';return}
 var f=FAVPOS[idx];
 var cached=ST.cut[f.id];if(cached&&Date.now()-cached.at<86400000){renderBand(out,score,f,cached.h);return}
 out.innerHTML='<p class="meta">正在查询该职位近 3 年进面分…</p>';
 var qs=(f.deptCode?'dept_code='+encodeURIComponent(f.deptCode):'')+(f.unit?'&unit='+encodeURIComponent(f.unit):'')+(f.title?'&title='+encodeURIComponent(f.title):'');
 apiFetch('/api/cutoffs/match?'+qs.replace(/^&/,''),{timeout:20000}).then(function(h){
  ST.cut[f.id]={h:h,at:Date.now()};saveST();renderBand(out,score,f,h)})
 .catch(function(e){out.innerHTML='<p class="meta">查询失败：'+esc(e&&e.message?e.message:'网络不可用')+'。可稍后重试。</p>'})}
function renderBand(out,score,f,h){var hist=h&&h.history&&h.history.length?h.history:null;
 if(!hist){out.innerHTML='<p class="meta">该职位暂无近 3 年进面分数据（如外交部单独公布岗位），无法对比。</p>';return}
 var mins=hist.map(function(x){return x.min_score}),maxs=hist.map(function(x){return x.max_score});
 var lo=Math.min.apply(null,mins),hi=Math.max.apply(null,maxs);
 var verdict,cls;
 if(score>hi){verdict='高于近三年最高进面分（有竞争力）';cls='cold'}
 else if(score>=lo){verdict='处于近三年进面分区间内（有机会）';cls='warm'}
 else{verdict='低于近三年最低进面分（差距较大，需继续提升）';cls='hot'}
 var domLo=Math.min(lo-5,score-5),domHi=Math.max(hi+5,score+5);
 var rows=hist.map(function(x){var l=Math.max(0,(x.min_score-domLo)/(domHi-domLo)*100),w=Math.max(4,(x.max_score-x.min_score)/(domHi-domLo)*100);
  return '<div class="mbar"><div class="lbl"><span>'+x.year+' 年</span><span class="mono">'+x.min_score.toFixed(1)+' – '+x.max_score.toFixed(1)+'（'+x.positions+' 岗 / '+x.entrants+' 人）</span></div>'
  +'<div class="bscale"><span class="band" style="left:'+l+'%;width:'+w+'%"></span><span class="sc" style="left:'+Math.max(0,Math.min(100,(score-domLo)/(domHi-domLo)*100))+'%"></span></div></div>'}).join('');
 out.innerHTML=
 '<div class="chips"><span class="tag '+cls+'">'+esc(verdict)+'</span></div>'
 +'<p class="meta" style="margin:4px 0">折算分 <b class="mono">'+score+'</b> vs '+esc(trunc(f.title,20))+' 近 3 年进面分 <b class="mono">'+lo.toFixed(1)+' – '+hi.toFixed(1)+'</b></p>'
 +rows
 +'<p class="meta" style="margin-top:8px">仅供参考，不构成预测、报考建议或结果承诺。单次模考不下结论，建议以近 3 次模考平均分对比；进面分来自国家公务员局面试名单（同部门同名职位汇总），每年分数线随题目难度与报考情况变化。</p>'}
</script>

var OTA={base:OTA_BASE,version:null,imagesBase:OTA_IMG_DEFAULT,syncing:false,lastResult:null,lastCheck:0};
var GROUPS={questions:['questions'],papers:['papers','paper_questions'],materials:['materials'],shenlun:['shenlun'],tree:['tree'],kaodian:['kaodian'],vocab:['vocab'],shizheng:['shizheng'],zhaokao:['zhaokao']};
function apiFetch(path,opt){opt=opt||{};var to=opt.timeout||20000;
 var ctl=new AbortController();var tm=setTimeout(function(){ctl.abort()},to);
 function attempt(){return fetch(OTA.base+path,{headers:{'X-App-Key':APP_KEY},signal:ctl.signal}).then(function(res){
  if(res.status===429){var e=new Error('rate');e.rl=true;throw e}
  if(!res.ok){throw new Error('HTTP '+res.status)}
  return res.json()})}
 return attempt().catch(function(e){
  if(e&&e.rl)return sleep(2600).then(attempt);
  throw e}).finally(function(){clearTimeout(tm)})}
function sha256Hex(str){var buf=new TextEncoder().encode(str);
 return crypto.subtle.digest('SHA-256',buf).then(function(d){return Array.from(new Uint8Array(d)).map(function(b){return ('0'+b.toString(16)).slice(-2)}).join('')})}
function canon(v){if(Array.isArray(v))return '['+v.map(canon).join(', ')+']';
 if(v&&typeof v==='object'){return '{'+Object.keys(v).sort().map(function(k){return JSON.stringify(k)+': '+canon(v[k])}).join(', ')+'}'}
 return JSON.stringify(v)}
function normHTML(s,extra){if(s==null)return '';
 var h=String(s).replace(/\r\n?/g,'\n').replace(/\n/g,'<br>');
 h=h.replace(/<img([^>]*?)src\s*=\s*["'](?:\.\/)?(?:images\/|assets\/img\/)?([^"']+)["']([^>]*)>/gi,function(m,pre,src,post){return '<img'+pre+' src="assets/img/'+src+'"'+post+'>'});
 if(extra&&extra.length&&!/<img/i.test(h)){h+=extra.map(function(n){return '<img src="assets/img/'+esc(n)+'">'}).join('')}
 return h}
function mapGroup(g,r){if(g==='questions'){return (r.questions||r).map(function(x){return{
  id:x.id,exam:x.exam||'',year:x.year,level:x.level||'',module:x.module,subType:x.sub_type_tag||'',
  materialId:x.material_id||null,stem:normHTML(x.stem,x.stem_images),
  options:(x.options||[]).map(function(o){return{key:o.key,content:normHTML(o.content,o.images)}}),
  answer:x.answer,analysis:normHTML(x.analysis,x.analysis_images),appearsIn:x.appears_in||[]}})}
 if(g==='papers'){var P=r.papers||[],PQ=r.paper_questions||[];var by={};
  PQ.forEach(function(x){(by[x.paper_id]=by[x.paper_id]||[]).push(x)});
  return P.map(function(p){var rows=(by[p.paper_id]||[]).slice();
   var order=p.modules?Object.keys(p.modules):[];
   rows.sort(function(a,b){var d=order.indexOf(a.module)-order.indexOf(b.module);
    return d!==0?d:(a.order_in_module||0)-(b.order_in_module||0)});
   return{exam:p.exam,paperId:p.paper_id,year:p.year,level:p.level,expectedTotal:p.expected_total,
    questionIds:rows.map(function(x){return x.id}),materialIds:rows.map(function(x){return x.material_id||null})}})}
 if(g==='materials'){var o={};(r.materials||[]).forEach(function(m){o[m.id]={id:m.id,paperId:m.paper_id,module:m.module,content:normHTML(m.content)}});return o}
 if(g==='tree'){return{tree:r.tree||[],mock_quota:r.mock_quota||{}}}
 return r}
function applyGroup(g,m){if(g==='questions'){window.QB_QUESTIONS=m;window.__QI=null}
 else if(g==='papers')window.QB_PAPERS=m;
 else if(g==='materials')window.QB_MATERIALS=m;
 else if(g==='shenlun')window.QB_SHENLUN=m;
 else if(g==='tree'){window.QB_TREE=m.tree;window.QB_MOCK_QUOTA=m.mock_quota}
 else if(g==='kaodian')window.QB_KAODIAN=m;
 else if(g==='vocab')window.QB_VOCAB=m;
 else if(g==='zhaokao')window.QB_ZHAOKAO=m;
 else if(g==='shizheng')window.QB_SHIZHENG=m}
function idbOpen(){return new Promise(function(res,rej){
 if(!window.indexedDB)return rej(new Error('no idb'));
 var rq=indexedDB.open('sy_ota',1);
 rq.onupgradeneeded=function(){try{rq.result.createObjectStore('kv')}catch(e){}};
 rq.onsuccess=function(){res(rq.result)};rq.onerror=function(){rej(rq.error)}})}
function idbSet(k,v){return idbOpen().then(function(db){return new Promise(function(res,rej){
 var tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);
 tx.oncomplete=function(){res()};tx.onerror=function(){rej(tx.error)}})})}
function idbAll(){return idbOpen().then(function(db){return new Promise(function(res,rej){
 var out=[];var tx=db.transaction('kv','readonly');var rq=tx.objectStore('kv').openCursor();
 rq.onsuccess=function(){var c=rq.result;if(c){out.push([c.key,c.value]);c.continue()}else res(out)};
 rq.onerror=function(){rej(rq.error)}})}).catch(function(){return []})}
function setSyncLine(t){var el=document.getElementById('syncLine');if(el)el.textContent=t}
function syncUI(){var b=document.getElementById('syncBtn');if(b)b.disabled=OTA.syncing;setSyncLine(syncStatusText())}
function otaCheck(manual){if(OTA.syncing){if(manual)toast('同步进行中…');return}
 OTA.syncing=true;syncUI();var upd=0,fail=0;
 apiFetch('/api/manifest',{timeout:15000}).then(function(man){
  OTA.version=man.version||OTA.version;OTA.imagesBase=man.images_base||OTA.imagesBase;OTA.lastCheck=Date.now();
  var prev=(OTAMETA&&OTAMETA.kinds)||{};
  var chain=Promise.resolve();
  Object.keys(GROUPS).forEach(function(g){chain=chain.then(function(){
   var kinds=GROUPS[g];
   var changed=kinds.some(function(k){return man.kinds[k]&&(!prev[k]||prev[k].sha!==man.kinds[k].sha256)});
   if(!changed)return;
   setSyncLine('同步 '+g+' …');
   var raws={};
   var c2=Promise.resolve();
   kinds.forEach(function(k){c2=c2.then(function(){
    return apiFetch(man.kinds[k].url,{timeout:90000}).then(function(raw){
     return sha256Hex(canon(raw)).then(function(hh){
      if(hh!==man.kinds[k].sha256){throw new Error(k+' 哈希不符，已丢弃')}
      raws[k]=raw})})})});
   return c2.then(function(){
    var mapped=mapGroup(g,raws);
    return idbSet(g,mapped).then(function(){applyGroup(g,mapped);
     kinds.forEach(function(k){prev[k]={sha:man.kinds[k].sha256,count:man.kinds[k].count,at:Date.now()}});
     upd++;setSyncLine('已完成 '+g)})})})});
  return chain.then(function(){
   OTAMETA={version:man.version,lastSync:Date.now(),imagesBase:OTA.imagesBase,kinds:prev};
   lsSet(LSK.meta,OTAMETA);
   OTA.lastResult=fail?('同步完成，'+fail+' 类失败'):(upd?('已同步 '+upd+' 类更新 · v'+man.version):('数据已是最新 · v'+man.version));
   updateNoticeDot()})
 }).catch(function(e){OTA.lastResult='检查更新失败：'+(e&&e.message?e.message:'网络不可用')})
 .finally(function(){OTA.syncing=false;syncUI();if(manual)toast(OTA.lastResult);
  if(!OVLS.length&&CUR!=='choose')rerenderView()})}

document.title=APP_NAME;
document.getElementById('appNameTop').textContent=APP_NAME;

go('home');
idbAll().then(function(entries){
 if(entries&&entries.length){entries.forEach(function(e){applyGroup(e[0],e[1])});rerenderView()}
}).then(function(){otaCheck(false)});
